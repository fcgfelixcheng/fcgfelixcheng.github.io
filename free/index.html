<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Tools</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/img/fcg-apple-touch-180.png">
<script>
(function(){
  // Free tools link -> WhatsApp 012-841 1329 with "FREE TOOLS" typed in.
  // The 012 WhatsApp Business greeting replies with fcgfelixcheng.com/agent-tools.
  var WA='https://wa.me/60128411329?text='+encodeURIComponent('Hi Felix, nak FREE TOOLS 🎁');
  window.__WA=WA;
  // ?s=ig / ?s=tiktok / ?s=ad tells the Pixel where the tap came from
  var s='free_tools';
  try{var m=/[?&]s=([a-z0-9_]{1,20})/i.exec(location.search);if(m)s+='_'+m[1].toLowerCase();}catch(e){}
  // Meta Pixel via image beacon, so the redirect does not wait for fbevents.js
  try{
    var px='https://www.facebook.com/tr?id=1818471292624398&noscript=1&dl='+encodeURIComponent(location.href)+'&ev=';
    new Image().src=px+'PageView';
    new Image().src=px+'Contact&cd[source]='+s;
  }catch(e){}
  setTimeout(function(){location.replace(WA)},250);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://wa.me/60128411329?text=FREE%20TOOLS"></noscript>
<style>
:root{--bg:#0B0B0B;--fg:#F4F2EE;--gold:#E4BC63;--muted:#9a978f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;text-align:center}
p{margin:0;font-size:16px;color:var(--muted)}
a.btn{display:inline-block;background:var(--gold);color:#0B0B0B;font-weight:700;font-size:17px;text-decoration:none;padding:15px 28px;border-radius:999px}
</style>
</head>
<body>
<main>
<p>Membuka WhatsApp untuk FREE TOOLS...</p>
<a class="btn" id="go" href="https://wa.me/60128411329?text=FREE%20TOOLS">Buka WhatsApp</a>
</main>
<script>try{document.getElementById('go').href=window.__WA}catch(e){}</script>
</body>
</html>
